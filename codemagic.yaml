workflows:
  lara-ios:
    name: lara iOS 构建
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: 安装 ldid
        script: |
          brew install ldid
          ldid -v || true
      - name: 编译打包
        script: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh
      - name: 上传并给出下载地址
        script: |
          set +e
          URL=$(curl -sS -F "file=@build/lara.ipa" -F "expires=72" https://0x0.st)
          echo "=============================="
          echo "DOWNLOAD_URL: $URL"
          echo "=============================="
    artifacts:
      - build/lara.ipa
