workflows:
  lara-ios:
    name: lara iOS 构建
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: 安装 ldid
        script: |
          brew install ldid
          ldid -v || true
      - name: 编译打包
        script: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh
      - name: 上传并给出下载地址
        script: |
          set +e
          URL=$(curl -sS -H "User-Agent: Mozilla/5.0" -F "reqtype=fileupload" -F "fileToUpload=@build/lara.ipa" https://catbox.moe/user/api.php)
          case "$URL" in
            http*) ;;
            *) URL=$(curl -sS -H "User-Agent: Mozilla/5.0" -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@build/lara.ipa" https://litterbox.catbox.moe/resources/internals/api.php) ;;
          esac
          case "$URL" in
            http*) ;;
            *) URL="上传失败，两个站点都拒了" ;;
          esac
          echo "=============================="
          echo "DOWNLOAD_URL: $URL"
          echo "=============================="
    artifacts:
      - build/lara.ipa
