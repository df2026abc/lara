workflows:
  lara-ios:
    name: lara iOS 构建
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: 安装 ldid
        script: |
          brew install ldid
          ldid -v || true
      - name: 编译打包
        script: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh
      - name: 上传给出下载链接
        script: |
          set +x
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
          F=build/lara.ipa
          U1=$(curl -sS -H "User-Agent: $UA" -F "reqtype=fileupload" -F "fileToUpload=@$F" https://catbox.moe/user/api.php)
          echo "catbox: $U1"
          U2=$(curl -sS -H "User-Agent: $UA" -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$F" https://litterbox.catbox.moe/resources/internals/api.php)
          echo "litterbox: $U2"
          U3=$(curl -sS -H "User-Agent: $UA" --upload-file "$F" https://transfer.sh/lara.ipa)
          echo "transfer: $U3"
    artifacts:
      - build/lara.ipa
