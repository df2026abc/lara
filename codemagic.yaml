workflows:
  lara-ios:
    name: lara iOS 构建
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: 安装 ldid
        script: |
          brew install ldid
          ldid -v || true
      - name: 编译打包
        script: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh
      - name: 提交到仓库（可直接下载）
        script: |
          git config user.email "build@lara.local"
          git config user.name "lara build"
          mkdir -p dist
          cp build/lara.ipa "dist/lara-$(date +%Y%m%d-%H%M).ipa"
          git add -f dist
          git commit -m "build: 新包 $(date +%Y%m%d-%H%M)" || true
          git push origin HEAD:main || echo "push failed"
    artifacts:
      - build/lara.ipa
